<div>
    <h1 style="text-align: center;">Pete's Pizza Delivery</h1>
    <h2 style="text-align: center;">Online Order Form</h2>
    <p style="text-align: center;">*required fields</p>
    <form action="">
        <fieldset>
            <legend>Customer details</legend>
            <br>
            <label for="name">*Name: </label>
            <input type="text" id="name">
            <br>
            <br>
            <label for="Add">*Address: </label>
            <input type="text" id="Add">
            <br>
            <br>
            <label for="city">*City: </label>
            <input type="text" id="city">
            <br>
            <br>
            <label for="post">*Postcode: </label>
            <input type="number" id="post" min="0">
            <br>
            <br>
            <label for="tel">*Tel: </label>
            <input type="number" id="tel" min="0">
            <br>
            <br>
            <label for="email">*Email: </label>
            <input type="email" id="email">
            <br>
        </fieldset>
        <fieldset style="display: inline;">
            <legend>Topping*</legend>
            <input type="radio" name="Topping">Margherita
            <br>
            <input type="radio" name="Topping">Four Seasons
            <br>
            <input type="radio" name="Topping">Meat Feast
        </fieldset>
        <fieldset style="display: inline;">
            <legend>Size*</legend>
            <input type="radio" name="Top">Small
            <br>
            <input type="radio" name="Top">Medium
            <br>
            <input type="radio" name="Top">Large
        </fieldset>
        <fieldset style="display: inline;">
            <legend>Extras*</legend>
            <input type="checkbox">Mushrooms
            <br>
            <input type="checkbox">Green peppers
            <br>
            <input type="checkbox">Anchovies
            <br>
            <input type="checkbox">Extra cheese
        </fieldset>
        <fieldset>
            <legend>Delivery</legend>
            <label for="time">Preferred delivery time</label>
            <input type="time" id="time">
            <br>
            <br>
            <label for="textarea">Delivery instructions:</label>
            <br>
            <textarea name="instructions" id="textarea" cols="49" rows="4"></textarea>
        </fieldset>

    </form>
</div>
