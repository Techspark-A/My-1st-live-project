<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in html</title>
</head>
<body>
    <h1>Forms in html</h1>
    <div>
        <form action="/action.php" target="_blank">
            <label for="name">Full name :</label>
            <input type="text" id="name" placeholder="Enter your name" required>
            <br><br>
            <label for="email">Email address :</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <br>
            <br>
            <label for="password">email password :</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            <br>
            <br>
            <label for="checkbox">checkbox :</label>
            <input type="checkbox" id="checkbox" required>
            <br>
            <br>
            <label for="phone">Enter your phone number :</label>
            <input type="number" id="phone" required min="0" max="10">
            <br>
            <br>
            <label for="genderm">Gender : Male</label>
            <input type="radio" id="genderm" name="gender">
            <label for="genderf">Female</label>
            <input type="radio" id="genderf" name="gender">
            <br>
            <br>
            <label for="date">Enter your brith date :</label>
            <input type="date" id="date" required>
            <br>
            <br>
            <label for="city1">Select your city </label>
            <select name="city" id="city1 required">
                <option value="chh.sambhajinagar">Pune</option>
                <option value="chh.sambhajinagar">mumbia</option>
                <option value="chh.sambhajinagar" selected>chh. sambhajinagar</option>
                <option value="chh.sambhajinagar">city</option>
                <option value="chh.sambhajinagar">delhi</option>
            </select>
            <br>
            <br>
            <label for="file">Upload your photo :</label>
            <input type="file" id="file" required>
            <br>
            <br>
            <button type="reset">Reset form</button>
            <br>
            <br>
            <button type="submit">Submit form</button>

        </form>
    </div>
</body>
</html>
